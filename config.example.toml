# paperful configuration. Copy to config.toml and edit:
#   cp config.example.toml config.toml

# Contact email sent to Crossref / Unpaywall / OpenAlex / NCBI ID Converter.
# Required by Unpaywall.
email = "you@example.org"

# Library adapter. zotero is well tested — use that.
# mendeley and endnote are in the tree and seeking testers. Do not treat them as proven.
# Mendeley: register an app at https://dev.mendeley.com/myapps.html
#   (redirect http://127.0.0.1:8765/callback), then: paperful session login mendeley
# EndNote: point library at the .enl. Writes land in state/endnote-import/ for File → Import.
#   paperful does not edit the EndNote database.
# Work (fetch, lint, patches) happens on disk; the manager is only read/write at the edges.
manager = "zotero"
# [mendeley]
# client_id = ""
# client_secret = ""
# # redirect_uri = "http://127.0.0.1:8765/callback"
# [endnote]
# library = "/path/to/Library.enl"

# Where PDFs land. Sub-folders mirror the Zotero collection path.
# Prefer relative paths (resolved against this config's folder; Compose mounts that folder at /data).
out_dir = "out"

# Where manifest.jsonl, metadata-patches.jsonl, pdf-cache/, last-run.json,
# state/runs/, sessions/, and the Zotero local-API key live.
state_dir = "state"

# Plain-language lines on the item (where a PDF came from, which duplicate to
# keep, why a snowball hit belongs). note is a child note; tag is a parent tag.
# The attachment stamp (paperful oa:unpaywall) stays either way.
# [remarks]
# surface = "note"   # note | tag | off

# Source order. Open-access first, then EZProxy, then HTML→PDF.
# Google Scholar is opt-in (CAPTCHA / session login). Append "scholar" when you
# want it, after `paperful session login scholar`. Remove "ezproxy" / "htmlpdf"
# to disable those lanes.
# Sci-Hub is off by default (legal grey zone in some jurisdictions). Opt in by
# appending "scihub" here, or pass --scihub on a run. You are responsible for
# complying with the laws that apply to you. See docs/scihub.md.
# htmlpdf + session vault: Playwright is a core dep; Chromium installs on first
# `paperful session login …` (or: uv run playwright install chromium)
sources = ["unpaywall", "openalex", "arxiv", "biorxiv", "europepmc", "semanticscholar", "core", "direct", "ezproxy", "htmlpdf"]
# sources = ["unpaywall", "openalex", "arxiv", "biorxiv", "europepmc", "semanticscholar", "core", "scholar", "direct", "ezproxy", "htmlpdf"]
# sources = ["unpaywall", "openalex", "arxiv", "biorxiv", "europepmc", "semanticscholar", "core", "scholar", "direct", "ezproxy", "htmlpdf", "scihub"]

# Campus EZProxy (any institution that offers login?url=). Leave empty to disable.
# Only used for DOIs and known publisher URLs (ScienceDirect, Springer, JSTOR, …),
# never YouTube, Zotero, FAO, or other non-publisher pages. See docs/ezproxy.md.
#   uv run paperful session login ezproxy
# Never put your password here. Campus acceptable use: docs/research-ops.md.
ezproxy_base = ""
# ezproxy_cookies = "state/ezproxy-cookies.txt"  # compat dump after session login
# scholar_cookies = "state/scholar-cookies.txt"   # compat dump; prefer session login scholar

# Skip sources that look inapplicable from item metadata (DOI, URL, …). --try-all overrides.
# source_routing = true
# Block-like failures (CAPTCHA, 429, …) before a source is skipped for the rest of the run.
# circuit_breaker_threshold = 3

# Ordered Sci-Hub mirrors. Reorder after `paperful mirrors` if one dies.
scihub_mirrors = ["sci-hub.ru", "sci-hub.ren", "sci-hub.box", "sci-hub.se", "sci-hub.st"]

# Random delay between Sci-Hub / EZProxy / htmlpdf requests, seconds [min, max].
delay_scihub_s = [3.0, 8.0]

# Parallelism for open-access sources; Scholar, EZProxy, htmlpdf, and Sci-Hub are always serial.
concurrency_oa = 4

# Reject downloads smaller than this (bytes) - usually an HTML error page.
min_pdf_bytes = 10000

# Title→DOI enrichment (Crossref, then OpenAlex, then Semantic Scholar): accept if similarity >= this.
crossref_min_score = 0.90
# Library DOI is suspect (eligible for in-memory swap) if title similarity is below this.
# Mid-range scores and API failures stay unknown and keep the original DOI.
# doi_suspect_score = 0.70
# verify_doi = true   # false → existing library DOIs are stamped unknown, never swapped
# CORE OA lookup (https://core.ac.uk/services/api). Empty key skips the source.
# core_api_key = ""
# Attach downloaded PDFs into Zotero (needs Zotero 10+ with local API enabled).
attach = true
app_name = "paperful"

# Consecutive network failures before a Sci-Hub mirror is skipped for the rest of the run.
mirror_failures_before_skip = 3

# Grey literature playbooks (rewrite / scrape / synthesize). Builtin pack =
# UNGA/undocs · BBNJ/DOALOS · ISA (+ FAO, OECD, IEA, WHO examples) — not product core.
# grey_playbooks_builtin = true
# Optional directory of extra pack TOML files (merged after builtin, before inline).
# Relative paths resolve against this config file's folder (Compose: packs/ under /data).
# grey_playbooks_dir = "packs"
# [[grey_playbooks]]
# name = "my_org"
# kind = "rewrite"
# hosts = ["example.org"]
# url_re = '(?i)example\\.org/docs/(?P<code>[a-z0-9]+)/?'
# pdf_template = "https://example.org/docs/{code}/{code}.pdf"
# [[grey_playbooks]]
# name = "my_org_scrape"
# kind = "scrape"
# hosts = ["example.org"]
# href_re = '\\.pdf$|/download/'
# [[grey_playbooks]]
# name = "my_doc_id"
# kind = "synthesize"
# match_re = '\\b(DOC-\\d{4}-\\d+)\\b'
# pdf_template = "https://docs.example.org/pdf?id={0}"

# Optional LLM (off by default). Local Ollama unless you opt into LiteLLM.
# Setup, model advice, and troubleshooting: docs/llm.md
#   ollama pull qwen2.5:7b          # local default; no Python extra needed
#   uv sync --extra llm             # LiteLLM for paid / OpenAI-compatible APIs (keys via env)
#   uv sync --extra browser-agent   # last `run` lane + `paperful recover` (Python 3.11+)
# [llm]
# enabled = false
# provider = "ollama"            # ollama | litellm
# model = "qwen2.5:7b"           # LiteLLM: "openai/gpt-4.1-mini" etc. (never "ollama/…")
# base_url = "http://127.0.0.1:11434"
# # api_base = ""                # LiteLLM / OpenAI-compatible base URL
# # allow_remote = false         # true for a non-loopback Ollama (Docker: host.docker.internal)
# timeout_s = 120
# max_num_ctx = 32768             # cap for Ollama num_ctx on summarize / synthesize
# [fix_metadata]
# llm_title = false              # grounded title proposals → metadata-patches.jsonl
# [lint]
# llm_pdf_match = false          # pdf_identity_mismatch finding
# llm_pdf_match_min_confidence = 0.6
# [summarize]
# prompt_template = "default"    # or "prompts/summary.md"
# max_context_chars = 24000
# tag = "paperful-summary"       # child-note tag; re-runs update, never duplicate
# dest = "both"                  # disk | zotero | both. disk keeps the Zotero tree clean
# [synthesize]
# prompt_template = "default"
# max_context_chars = 24000
# tag = "paperful-report"
# dest = "both"
# # timeout_s = 300              # default max(llm.timeout_s, 300)
# [browser_agent]
# max_steps = 20
# max_wall_s = 300
# during_run = true              # last serial lane after Scholar / EZProxy / htmlpdf fail
# # model = "qwen2.5:14b"        # larger model for browsing only

# Named run configs (not grey-lit playbooks). Same keys work in profiles/<name>.toml
# beside this file. Select with: paperful all --profile bbnj-journal
# See docs/workflows.md.
# [profiles.bbnj-journal]
# description = "BBNJ journal articles 2021–2026"
# collections = ["BBNJ"]
# types = ["journalArticle"]
# year_from = 2021
# year_to = 2026
# try_all = true
# retry_failed = true
# upgrade_linked = true
# apply = true
# steps = ["gaps", "run", "lint", "fix-metadata", "summarize"]

# Quiet mirror. snapshot copies existing Zotero PDFs only when pdfs = "all".
# additional — keep PDFs paperful fetched; do not export files already in Zotero
# all        — also export imported/linked-file PDFs into the item folder
# none       — records and notes only; do not delete PDFs already on disk
# run always writes PDFs it downloads, whatever this is set to.
[mirror]
pdfs = "additional"

# Snowball grows a library from a keyword, DOI, ORCID, or collection.
# Off until you set enabled. Dry-run / approve-batch write state/snowball/.
# gate = "auto" plus target_collection creates parents. fetch_pdfs is
# off (metadata only), fast (first pass), or full (then the run stack).
# true means fast. direction = refs|cites|both|keywords|refs+keywords|cites+keywords|refs+cites+keywords.
# both stays references plus cited-by. keyword_limit is 1–5 (all is refused).
# keyword_hop_limit is a positive integer (all is refused; a keyword is an open query).
# About 12% of works have no topic and therefore no keywords. Those seeds are
# reported at the start of a keyword hop and skipped on that side.
# OPENALEX_API_KEY belongs in the environment, not in this file.
# Snowball tries OpenAlex without a key first (enough for a small search; the
# allowance is shared by IP, including a VPN exit). A configured key takes over
# when that allowance is spent. mailto does not raise either budget.
# SEMANTIC_SCHOLAR_API_KEY is optional and also stays in the environment.
# The public API is enough until heavy use; request a key, it is not self-serve.
# [snowball]
# enabled = false
# max_candidates = 200     # all keeps every new+exists row
# per_hop_limit = 50       # neighbours per seed per hop. all keeps every one
# per_hop_rank = "most-cited"  # most-cited | least-cited | random
# depth = 1
# direction = "refs"
# keyword_limit = 3       # 1–5. 5 uses every keyword OpenAlex stored. all is refused
# keyword_hop_limit = 50  # works per seed on the keyword side. all is refused
# keyword_min_score = 0   # 0 keeps whatever OpenAlex assigned
# keyword_limit = 3       # 1–5. 5 uses every keyword OpenAlex stored. all is refused
# keyword_hop_limit = 50  # works per seed on the keyword side. all is refused
# keyword_min_score = 0   # 0 keeps whatever OpenAlex assigned
# gate = "dry-run"
# target_collection = ""
# fetch_pdfs = "off"     # off | fast | full. true means fast
# dedupe_scope = "library"   # library | collection | none
# tag_prefix = "paperful-snowball"
# types = ["article", "review"]  # empty = journal-article-shaped
# oa_only = false
# venue_include = []
# venue_exclude = []
# languages = []
# min_seed_citations = 0
# note_provenance = true
# backends = ["openalex", "crossref", "semanticscholar", "orcid", "europepmc", "pdf"]
# approve_each_max = 20
# hybrid_seeds = 5
# refine = false

# Text layer for scanned PDFs (paperful ocr). Needs ocrmypdf on PATH.
# The Compose image ships English. Add tesseract language packs for the rest.
# [ocr]
# languages = "eng"       # eng+fra or "eng fra"
# timeout_s = 600

# Attachment layout. Off until `paperful attachments --apply`.
# [attachments]
# fix_broken = false
# merge_files = false
# rename = false
# link = false

