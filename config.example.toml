# Author PDF requests. Default off. ResearchGate is handoff-only: Paperful opens an
# existing researchgate.net/publication URL in your system browser. You click
# Request full-text (RG ToS). Paperful never clicks and does not search RG.
# Contact-only (no fetch): paperful reachout -C … --to reachout.csv
# email / both / delay are policy only in this version (no mail send).
# [request]
# channels = "off"               # off | rg | email | both | rg_then_email_after_days
# email_after_days = 14

# Twenty is an open-source CRM (https://twenty.com, docs https://docs.twenty.com).
# Opt-in. Never a default. API key in env TWENTY_API_KEY only.
# Behavior (lookup cache, sync, late author_site, write-back): docs/snowball.md
# under "Twenty and SearXNG". Paperful does not send mail.
# [twenty]
# enabled = false
# base_url = ""                  # or TWENTY_BASE_URL
# lookup_on_preflight = false    # with snowball --author-site-preflight; still proposed packs
# retry_max = 8
# retry_base_seconds = 1.0
# sync_note_title = "Paperful"
# provenance_keyword = "paperful"
# fetch_listing_max = 20         # live People website lookups per run, after the cache
# writeback_listings = false     # or pass --twenty-writeback on snowball / run

# Manual PDF handoff after soft-blocked OA misses (gaps --list-missing / --handoff).
# [gaps]
# handoff = "list"                 # list | tabs | walk | watch
# downloads_dir = "~/Downloads"    # newest *.pdf pickup for --handoff walk

# PDF drop folder for --handoff watch and `paperful inbox watch` / `drain`.
# Not snowball's state/snowball/watches/*/inbox.jsonl. Point the browser
# download directory here (or Save As into it). Empty dir = feature off.
# Bare `inbox watch` / `drain` match PDF DOIs across the whole library;
# pass -C only to narrow. Handoff watch stays collection-scoped (+ FIFO).
# [inbox]
# dir = "~/Documents/paperful_inbox"
# watch_after_handoff = true       # after --handoff tabs|watch, keep polling
# poll_seconds = 2.0
# settle_seconds = 1.5             # size must stay stable before ingest
# idle_seconds = 0                 # 0 = wait forever (Ctrl+C)
# match = "doi_only"               # doi_only | doi+title | doi+title+ocr | full
# quarantine_after_s = 0           # hold unmatched PDFs before unmatched/
# ocr_for_match = false
# llm_match = "off"                # off | when_thin | always
# llm_match_min_confidence = 0.75
# llm_auto_attach_min = 0.92
# create = "attach_only"           # attach_only | create_gated | create_auto
# route = "off"                    # off | gated | auto — pick -C when omitted
# llm_route = "off"                # off | when_thin | always
# route_min_confidence = 0.75
# route_auto_min = 0.92
# title_resolve = false            # Crossref/OpenAlex title search when local match is thin
# manager_metadata_s = 0           # wait after attach for a manager recognizer
# [ingest]
# default_tags = []
# dedupe_scope = "library"

# Named run configs (not grey-lit playbooks). Same keys work in profiles/<name>.toml
# beside this file. Select with: paperful all --profile bbnj-journal
# See docs/workflows.md.
# [profiles.bbnj-journal]
# description = "BBNJ journal articles 2021–2026"
# collections = ["BBNJ"]
# types = ["journalArticle"]
# year_from = 2021
# year_to = 2026
# try_all = true
# retry_failed = true
# upgrade_linked = true
# apply = true
# steps = ["gaps", "run", "lint", "fix-metadata", "summarize"]

# The mirror under out/. Commands refresh it from the manager, then read it.
# pdfs: what to do with PDFs the manager already holds.
#   all  — copy every one into its item folder (paperful sync does the first pass)
#   lazy — copy one the first time a command needs it
#   none — keep them out of the mirror; PDFs already on disk are not deleted
# run always writes PDFs it downloads, whatever this is set to.
# refresh: auto (each command refreshes first) or manual (only paperful sync).
# gone: an item trashed or deleted in the manager. mark keeps its folder in
#   place and marks the record; trash also moves it under out/_trash/.
[mirror]
pdfs = "all"
refresh = "auto"
gone = "mark"

# Firefox add-on capture. Independent of [mirror].refresh.
# snapshot = auto refreshes out/ once before a capture, even when mirror
# refresh is manual. off skips that refresh; a live Zotero read still runs.
[extension]
snapshot = "auto"
collection = "Capture"
# drop = ""         # empty: inbox dir, else state/capture/drop
# The add-on copies a just-downloaded PDF from ~/Downloads into drop/.
concurrency = 2

# Snowball grows a library from a keyword, DOI, ORCID, or collection.
# Off until you set enabled. Dry-run / approve-batch write state/snowball/.
# gate = "auto" plus target_collection creates parents. fetch_pdfs is
# off (metadata only), fast (first pass), or full (then the run stack).
# true means fast. direction = refs|cites|both|keywords|refs+keywords|cites+keywords|refs+cites+keywords.
# Default direction is refs+keywords. Set direction = "refs" to drop the keyword hop.
# both stays references plus cited-by. keyword_limit is 1–5 (all is refused).
# keyword_hop_limit is a positive integer (all is refused; a keyword is an open query).
# search_keywords (default true) unions OpenAlex keyword-tag matches into search/hybrid
# hit lists. Set search_keywords = false (or --no-search-keywords) for full-text only.
# Works with no topic have no keywords (the share is unmeasured since OpenAlex
# reassigned topics in Oct 2026). Those seeds are reported at the start of a
# keyword hop and skipped on that side.
# OPENALEX_API_KEY belongs in the environment, not in this file.
# Snowball tries OpenAlex without a key first (enough for a small search; the
# allowance is shared by IP, including a VPN exit). A configured key takes over
# when that allowance is spent. mailto does not raise either budget.
# SEMANTIC_SCHOLAR_API_KEY is optional and also stays in the environment.
# The public API is enough until heavy use; request a key, it is not self-serve.
#
# Optional. Most users leave this unset — see docs/config.md#advanced.
# Download or host the OpenAlex parquet snapshot yourself; Paperful does not ship it.
# Live API first; snapshot is the fallback when the daily budget is spent.
# Citing needs a cites index:
#   paperful openalex-store build-cites
# then set cites_index_glob. Build is resumable (per updated_date + .done
# markers). Store cites-query is title-only (display_name).
# When the live API daily budget is spent, DOI/id and citing keep using the store.
# Keywords / ORCID / full-text search stay API-only.
# [openalex_store]
# backend = "local_duckdb"   # or ssh_duckdb; later: http
# parquet_glob = "/data/openalex/data/works/**/*.parquet"
# cites_index_glob = "/data/openalex/cites/**/*.parquet"
# # duckdb_bin = "duckdb"
# # timeout_s = 120
# # fail_limit = 3              # skip the store after this many fallback errors in one run
# # build_timeout_s = 7200
# # snapshot_date = "2026-10-14"  # full snapshot you loaded; doctor warns if older than 14 Oct 2026
# # ssh_host = "nuc"         # ssh_duckdb only
# # ssh_user = "you"
# Alert loop / weekly collection digest. Paperful does not schedule;
# point cron at `paperful keepup run <name>`. Interval is also stored per job.
# [keepup]
# interval_days = 7

# Phrase → held PDF passages plus OpenAlex works not in the library.
# Always dry-run. Empty public hits are a query/budget result, not novelty.
# [precedent]
# held_k = 10
# public_k = 25
# search_keywords = true

# [snowball]
# enabled = false
# max_candidates = 200     # all keeps every new+exists row
# per_hop_limit = 50       # neighbours per seed per hop. all keeps every one
# per_hop_rank = "most-cited"  # most-cited | least-cited | random
# depth = 1
# direction = "refs+keywords"
# search_keywords = true  # search/hybrid also pulls matching OpenAlex keyword tags
# keyword_limit = 3       # 1–5. 5 uses every keyword OpenAlex stored. all is refused
# keyword_hop_limit = 50  # works per seed on the keyword side. all is refused
# keyword_min_score = 0   # 0 keeps whatever OpenAlex assigned
# gate = "dry-run"
# target_collection = ""
# fetch_pdfs = "off"     # off | fast | full. true means fast
# dedupe_scope = "library"   # library | collection | none
# tag_prefix = "paperful-snowball"
# default_tags = []
# types = ["article", "review"]  # empty = journal-article-shaped
# study_designs = []  # OpenAlex: rct, meta-analysis, systematic-review, …
# map_categories = ["evidence-synthesis", "trials", "clinical-trials", "observational", "case-reports", "protocols", "narrative-reviews", "preprints", "books", "commentary"]
# map_category_defs = [
#   { id = "preprints", label = "Preprints", any_types = ["preprint", "posted-content"] },
# ]
# oa_only = false
# venue_include = []
# venue_exclude = []
# languages = []
# min_seed_citations = 0
# note_provenance = true
# backends = ["openalex", "crossref", "semanticscholar", "orcid", "europepmc", "pdf"]
# approve_each_max = 20
# hybrid_seeds = 5
# refine = false
# dedupe_after = "off"           # off | classify | apply
# author_site_preflight = false
# author_site_max_authors = 15
# author_site_max_queries = 20
# stop_rule = "off"          # off | marginal_yield | asymptotic_coverage | budget | any
# stop_eps = 0.01            # Keep rate below this for stop_k hops
# stop_k = 2                 # cannot fire before hop k+1
# stop_tau = 0.95
# stop_min_points = 4
# stop_max_screened = 0      # budget cap; 0 means unset

# People lists: `paperful authorwatch`. Caps are CLI flags on `authorwatch run`
# (`--max-authors` 50, `--per-author-limit` 200). No [authorwatch] table is
# parsed. No scrape of social follows; import a CSV. See docs/authorwatch.md.

# SearXNG is a metasearch engine (docs https://docs.searxng.org/).
# Public instances: https://searx.space/ — Paperful needs GET /search?format=json,
# which many public hosts leave off. Run your own if JSON is disabled.
# Never a default run source. Used by `paperful search` / Discover → Web
# and author-site remainder. See docs/search.md and docs/snowball.md
# "Twenty and SearXNG".
# [searxng]
# base_url = ""                  # instance root; or SEARXNG_BASE_URL
#
# [search]
# max = 20                       # kept hits; CLI --max overrides
# probe = true                   # HEAD/GET PDF vs HTML; --no-probe skips

# Text layer for scanned PDFs (paperful ocr). Needs ocrmypdf on PATH.
# The Compose image ships English. Add tesseract language packs for the rest.
# [ocr]
# languages = "eng"       # eng+fra or "eng fra"
# timeout_s = 600

# Library index for `paperful rag` and `paperful ask`. Needs `pip install 'paperful[rag]'`.
# Reads PDFs and records from out_dir only; it never calls the reference manager.
# `ask` also needs [llm].enabled. The index lives under state_dir/rag, one folder per
# embedding model, so changing embed_model builds a new index and keeps the old one.
# [rag]
# enabled = false
# auto_ingest = false            # index new PDFs after run / attach / inbox / snapshot / ocr
# ocr = "auto"                   # auto | off. auto runs OCRmyPDF on scans and rewrites them under out_dir
# parser = "light"               # light | docling | grobid (grobid needs [grobid].enabled)
# embed_provider = "ollama"      # ollama | litellm
# embed_model = "nomic-embed-text"   # multilingual library: "bge-m3". LiteLLM: "openai/text-embedding-3-small"
# # embed_base_url = ""          # Ollama root; empty uses [llm].base_url
# # embed_api_base = ""          # LiteLLM base URL; empty uses [llm].api_base
# embed_batch_size = 32
# chunk_chars = 2048
# chunk_overlap = 256
# top_k = 10                     # passages sent to the model per question (simple mode)
# max_context_chars = 24000
# hybrid = true                  # vector + full-text search
# abstracts = true               # index the abstract when an item has no readable PDF
# # model = ""                   # chat model for `ask`; empty uses [llm].model
# focus = "default"              # default | questions | gaps | methods | answered | conflict
# # prompt = ""                  # custom system prompt file; overrides focus when set
# dest = "disk"                  # batch ask note writes: disk | zotero | both (needs --apply)
# extract_questions_llm = false  # LLM lane for `rag questions` (rules always run)
# ask_mode = "simple"            # simple (raw excerpts) | advanced (score then answer)
# max_chunks_per_item = 3
# overfetch = 3
# # Advanced-only knobs. Ignored when ask_mode is simple. --ask-mode overrides the mode for one run.
# evidence_k = 8                 # candidate passages to score
# answer_max_sources = 5
# relevance_cutoff = 1           # drop scores below this (0 still dropped)
# # summary_model = ""           # empty uses [rag].model or [llm].model
# summary_length = "about 80 words"
# summary_concurrency = 2
# evidence_fallback = "raw"      # raw keeps the chunk if a summary call fails; drop discards it
# query_variants = 1             # 2–4: extra search phrasings, fused
# insufficient_retries = 0       # 1: re-gather once if excerpts are not enough
# cite_hops = 0                  # 1: one hop along on-disk citation edges inside the Ask scope
# cite_scope = "scope"           # scope | library
# mmr_lambda = 1.0               # 1.0 off; below 1 diversity rerank
# context_neighbors = 0          # advanced: append the next stored chunk onto each hit

# IMRaD-style section extract (`paperful extract-sections`). Reads mirror PDFs / text cache only.
# [extract_sections]
# llm = false                    # fill missing MVP fields; still needs [llm].enabled
# headings = ""                  # extra synonym TOML; also loads state/section-headings.toml when present
# fields = ["abstract", "conclusion", "methodology", "research_questions"]
# raw_map = true                 # include detected section headings in JSON
# max_field_chars = 20000

# Workbench UI (paperful serve). Library and Wanted item tables share these sizes.
# attach_mode is the Grab write: manual (default) or auto.
# auto attaches only when the library can be written (Zotero 10 or newer).
# Zotero 7–9 always leaves the PDF under out/.
# [ui]
# library_page_size = 50
# library_page_sizes = [25, 50, 100, 200]
# attach_mode = "manual"
# citation_map_edit = "both"           # sidebar | popup | both | off
# citation_map_auto_search = false     # Find PDF right after Add to library
# citation_map_remove = "trash"        # trash (default)
# coauthor_network = "on"              # People tab ORCID ego map (on | off)
# web_search = "on"                    # Discover → Web (SearXNG grey search)

# Attachment layout. Off until `paperful attachments --apply`.
# [attachments]
# fix_broken = false
# merge_files = false
# rename = false
# link = false

