# promote = "gated"       # gated | auto
# auto_min_hits = 2
# [[grey_playbooks]]
# name = "my_org"
# kind = "rewrite"
# hosts = ["example.org"]
# url_re = '(?i)example\\.org/docs/(?P<code>[a-z0-9]+)/?'
# pdf_template = "https://example.org/docs/{code}/{code}.pdf"
# [[grey_playbooks]]
# name = "my_org_scrape"
# kind = "scrape"
# hosts = ["example.org"]
# href_re = '\\.pdf$|/download/'
# [[grey_playbooks]]
# name = "my_doc_id"
# kind = "synthesize"
# match_re = '\\b(DOC-\\d{4}-\\d+)\\b'
# pdf_template = "https://docs.example.org/pdf?id={0}"

