# paperful configuration. Copy to config.toml and edit:
#   cp config.example.toml config.toml

# Contact email sent to Crossref / Unpaywall / OpenAlex / NCBI ID Converter.
# Required by Unpaywall.
email = "you@example.org"

# Library adapter. zotero is well tested — use that.
# mendeley and endnote are in the tree and seeking testers. Do not treat them as proven.
# Mendeley: register an app at https://dev.mendeley.com/myapps.html
#   (redirect http://127.0.0.1:8765/callback), then: paperful session login mendeley
# EndNote: point library at the .enl. Writes land in state/endnote-import/ for File → Import.
#   paperful does not edit the EndNote database.
# Work (fetch, lint, patches) happens on disk; the manager is only read/write at the edges.
manager = "zotero"
# [mendeley]
# client_id = ""
# client_secret = ""
# # redirect_uri = "http://127.0.0.1:8765/callback"
# [endnote]
# library = "/path/to/Library.enl"

# Where PDFs land. Sub-folders mirror the Zotero collection path.
# Prefer relative paths (resolved against this config's folder; Compose: /data, with PAPERFUL_OUT at /data/out).
out_dir = "out"

# Where manifest.jsonl, metadata-patches.jsonl, pdf-cache/, last-run.json,
# state/runs/, sessions/, and the Zotero local-API key live.
state_dir = "state"

# Plain-language lines on the item (where a PDF came from, which duplicate to
# keep, why a snowball hit belongs). note is a child note; tag is a parent tag.
# The attachment stamp (paperful oa:unpaywall) stays either way.
# [remarks]
# surface = "note"   # note | tag | off

# OA honesty: stamp license / oa_status / version on record.json; optional block list.
# [oa_honesty]
# stamp_fields = ["license", "oa_status", "version"]
# license_block = []   # substring match on license, e.g. "cc-by-nc-nd"

# Protect hand-curated collections from paperful writes. Subtree match on path
# (or stable key). mode = full (no writes), add_only (create/add OK; no edit),
# or custom with allow_* flags. protect_items blocks mutating items that sit in
# the subtree even when they also belong elsewhere. skip_library_scope omits
# items that live only under the rule from unscoped / --library runs.
# [[exclude]]
# path = "Hand curated"
# mode = "full"
# [[exclude]]
# path = "Inbox/Staging"
# mode = "add_only"
# [[exclude]]
# path = "Projects/BBNJ"
# mode = "custom"
# allow_create = true
# allow_add = true
# allow_update = false
# # key = "ABCD1234"

# Source order. Open-access first, then EZProxy, then HTML→PDF.
# Google Scholar is opt-in (CAPTCHA / session login). Append "scholar" when you
# want it, after `paperful session login scholar`. Remove "ezproxy" / "htmlpdf"
# to disable those lanes.
# Sci-Hub is off by default (legal grey zone in some jurisdictions). Opt in by
# appending "scihub" here, or pass --scihub on a run. You are responsible for
# complying with the laws that apply to you. See docs/scihub.md.
# htmlpdf + session vault: Playwright is a core dep; Chromium installs on first
# `paperful session login …` (or: uv run playwright install chromium)
sources = ["unpaywall", "openalex", "arxiv", "biorxiv", "europepmc", "semanticscholar", "core", "openaire", "direct", "ezproxy", "htmlpdf"]
# sources = ["unpaywall", "openalex", "arxiv", "biorxiv", "europepmc", "semanticscholar", "core", "openaire", "scholar", "direct", "ezproxy", "htmlpdf"]
# sources = ["unpaywall", "openalex", "arxiv", "biorxiv", "europepmc", "semanticscholar", "core", "openaire", "scholar", "direct", "ezproxy", "htmlpdf", "scihub"]

# Campus EZProxy (any institution that offers login?url=). Leave empty to disable.
# Only used for DOIs and known publisher URLs (ScienceDirect, Springer, JSTOR, …),
# never YouTube, Zotero, FAO, or other non-publisher pages. See docs/ezproxy.md.
#   uv run paperful session login ezproxy
# Never put your password here. Campus acceptable use: docs/research-ops.md.
ezproxy_base = ""
# Pause on a TTY when the campus session is dead: before batch 1, at the next
# batch boundary mid-run, and after the fetch (retry session-expired items).
# ezproxy_relogin = true
# ezproxy_cookies = "state/ezproxy-cookies.txt"  # compat dump after session login
# scholar_cookies = "state/scholar-cookies.txt"   # compat dump; prefer session login scholar

# Skip sources that look inapplicable from item metadata (DOI, URL, …). --try-all overrides.
# source_routing = true
# Block-like failures (CAPTCHA, 429, …) before a source is skipped for the rest of the run.
# circuit_breaker_threshold = 3

# Ordered Sci-Hub mirrors. Reorder after `paperful mirrors` if one dies.
scihub_mirrors = ["sci-hub.ru", "sci-hub.ren", "sci-hub.box", "sci-hub.se", "sci-hub.st"]

# Random delay between Sci-Hub / EZProxy / htmlpdf requests, seconds [min, max].
delay_scihub_s = [3.0, 8.0]

# Parallelism for open-access sources; Scholar, EZProxy, htmlpdf, and Sci-Hub are always serial.
concurrency_oa = 4

# Reject downloads smaller than this (bytes) - usually an HTML error page.
min_pdf_bytes = 10000

# One-page PDF gate: sparse stubs (ethics/consent forms) soft-reject and keep
# searching; denser one-pagers (letters, short comments) save but wait for
# `paperful attach --allow-short-pdf`. Set gate_short_pdfs = false to disable.
# gate_short_pdfs = true
# short_pdf_min_words = 200

# Title→DOI enrichment (Crossref, then OpenAlex, then Semantic Scholar): accept if similarity >= this.
crossref_min_score = 0.90
# Library DOI is suspect (eligible for in-memory swap) if title similarity is below this.
# Mid-range scores and API failures stay unknown and keep the original DOI.
# doi_suspect_score = 0.70
# verify_doi = true   # false → existing library DOIs are stamped unknown, never swapped
# CORE OA lookup (https://core.ac.uk/services/api). Empty key skips the source.
# core_api_key = ""
# Attach downloaded PDFs into Zotero (needs Zotero 10+ with local API enabled).
attach = true
app_name = "paperful"

# Consecutive network failures before a Sci-Hub mirror is skipped for the rest of the run.
mirror_failures_before_skip = 3

# Grey literature playbooks (rewrite / scrape / synthesize). Builtin pack =
# UNGA/undocs · BBNJ/DOALOS · ISA + FAO, RFMO, IUCN/DOSI, IDDRI/Pew.
# Optional copies (IEA/IRENA, OECD/WHO/UNEP/UNDP): paperful/data/grey_playbooks_examples/
# grey_playbooks_builtin = true
# Optional directory of extra pack TOML files (merged after builtin, before inline).
# Relative paths resolve against this config file's folder (Compose: packs/ under /data).
# grey_playbooks_dir = "packs"
# Learned recipes (not shipped): paperful playbooks propose / promote
# writes packs/learned.toml. auto may promote flukes — leave gated unless
# you will edit that file.
