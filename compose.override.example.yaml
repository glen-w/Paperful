# Optional local Compose overrides (gitignored as compose.override.yaml).
#
# Prefer editing .env for mount locations and image pack:
#   PAPERFUL_DATA=../paperful-data   # config/state/packs (recommended)
#   PAPERFUL_OUT=../paperful-out     # PDF mirror (recommended)
#   PAPERFUL_DATA=.                  # keep config/state in the repo
#   PAPERFUL_OUT=./out               # keep out/ in the repo
#   PAPERFUL_IMAGE_MODE=heavy        # full local: llm + rag + browser-agent
#
# Example: pin Zotero host explicitly
#
# services:
#   paperful:
#     environment:
#       PAPERFUL_ZOTERO_HOST: host.docker.internal
#
# Optional GROBID sidecar (CRF CPU image). Paperful does not start this
# unless you copy this file to compose.override.yaml. Several GB of RAM.
# Same Compose network: set [grobid].base_url = "http://grobid:8070" and
# enabled = true. Scans need `paperful ocr` first. See docs/grobid.md.
#
# services:
#   grobid:
#     image: lfoppiano/grobid:0.8.2
#     init: true
#     ports:
#       - "127.0.0.1:8070:8070"
#     ulimits:
#       core: 0
