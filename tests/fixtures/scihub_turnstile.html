<!DOCTYPE html><html><head><meta charset="utf-8"><title>Verification - Sci-Hub</title>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</head><body><div class="container">
<h1>Verification</h1>
<p>Please complete the check to continue.</p>
<div class="cf-turnstile" data-sitekey="0x4AAAAAADXMHnrF-Ni1NbSL" data-callback="onVerified"></div>
<p id="verify-status">Waiting for verification...</p>
</div>
<script>
function onVerified(token){
  fetch('/api/verify-turnstile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})});
}
</script></body></html>
