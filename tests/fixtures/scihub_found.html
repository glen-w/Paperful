<script>

    function unwrap(window)
    {
        window = document.querySelector('dialog.' + window)
        window.style.visibility = 'visible'
        window.showModal()
    }

    function wrap(window)
    {
        window = document.querySelector('dialog.' + window)
        window.style.visibility = 'hidden'
        window.close()
    }

    function array(objects) { return Array.isArray(objects) ? objects : ( objects instanceof HTMLCollection ? Array.prototype.slice.call(objects) : [ objects ] ) }

    function toggle(objects, on = true)
    {
        objects = array(objects)

        for (let o of objects)
        {
            o.classList.add(on ? 'yes' : 'no')
            o.classList.remove(on ? 'no' : 'yes')
        }
    }

    function select(objects, on = true)
    {
        objects = array(objects)

        for (let o of objects)
        if  (on) o.classList.add('selected')
        else     o.classList.remove('selected')
    }

</script>
        

<script>

    function recite(style)
    {
        style = style == 'ГОСТ' ? 'gost' : style.toLowerCase()

        fetch('/recite/' + style + '/10.1016/j.marpol.2017.05.011')
            .then(response =>
            {
                if (response.ok)
                    return response.json()

                throw new Error(`${response.status}`)
            })
            .then(result =>
            {
                let buttons = document.querySelector('dialog.styles').getElementsByTagName('button')
                let plain   = document.querySelector('dialog.styles .plain button')

                if (style == 'plain' && result.success)
                {
                    select(buttons, false)
                    select(plain)
                    toggle(plain)
                }

                else

                if (result.style)
                {
                    for (let button of buttons)
                        select(button, button.innerText == result.style)
                    
                    toggle(plain, null)
                }

                citestyle(style, result)

                wrap('styles')
                
            })
            .catch(error => { console.error(error) })
    }

</script>

        <script>

            var check   = setInterval(checksum, 2000)
            var retry   = 8

            var captcha = {}

            async function live(buffer)
            {
                await fetch('/live',
                {
                    method: 'POST',
                    body: JSON.stringify({ url: '/storage/zero/6364/41ab8ffb30f3383b52e955640fd17dc4/ding2017.pdf', doi: '10.1016/j.marpol.2017.05.011' })
                })
            }

            async function calc(buffer)
            {
                let hash = await crypto.subtle.digest('SHA-256', buffer)

                hash = Array.from(new Uint8Array(hash))
                hash = hash.map(b => b.toString(16).padStart(2, '0')).join('')

                return hash == '0efb03746ceebcc9bde83a3498cc11f3ae9ec7b4a7a743505ae0eed613ba2bf6'
            }

            function nameshow(appear = true)
            {
                let name = document.querySelector('.name')
                
                if (name.classList.contains('appear') && !appear)
                    name.classList.add('disappear')

                if (appear)
                    name.classList.add('appear')

                name.classList.remove(!appear ? 'appear' : 'disappear')
            }

            function checksum()
            {
                fetch('/storage/zero/6364/41ab8ffb30f3383b52e955640fd17dc4/ding2017.pdf',
                {
                    mode  : 'same-origin',
                    cache : 'only-if-cached'
                })
                .then(async (response) =>
                {
                    if (response.ok)
                    {
                        clearInterval(check)

                        var buffer = await response.arrayBuffer()
                        if (buffer)
                            if (buffer.byteLength < 1024* 1024 * 2)
                            {
                                if (await calc(buffer))
                                    await  live()
                            }

//                        await mark(buffer)
                    }
                })
                .then().catch(error =>
                { 
                    retry -= 1;
                    if (retry == 0)
                        clearInterval(check)
                })
            }

            async function mark(buffer)
            {
                try
                {
                    console.log('Markdown...');
                    var markdown = await window.pdf2md(buffer);

                    console.log(markdown);
                }
                
                catch (err) { console.error(err) }
            }

            async function report()
            {
                document.querySelector("dialog.problem .submit").style.display = 'none'

                let status = document.querySelector('.status')
                status.style.display = 'block'
                status.innerText = local('sending')

                try
                {
                    let reason = document.querySelector('input[name="reason"]:checked')
                    let data   = {captcha: captcha, reason: reason.value}

                    let response = await fetch('/problem/10.1016/j.marpol.2017.05.011',
                    {
                        method   : 'POST', 
                        headers  : { 'Content-Type': 'application/json' },
                        body     : JSON.stringify(data)
                    })

                    if (response.ok)
                    {
                        response = await response.json()

                        console.log(response)

                        if (response.result == 'success')
                        {
                            document.querySelector("dialog.problem .reason").style.display = 'none'

                            status.innerText = local('success')
                            return true
                        }
                    }

                    else
                        throw new Error(response.status)

                } catch (error) { console.error(error) }

                status.innerText = local('error')
            }

            window.onload = function()
            {
                let reports = document.querySelectorAll('input[name="reason"]')
                for (let radio of reports)
                    radio.addEventListener('change', () =>
                        document.querySelector('dialog.problem .submit').style.display = 'flex')


                document.querySelector('altcha-widget').configure({
                    strings: {
                        label: local('robot'),
                        verifying: local('verifying')
                    },
                })

                document.querySelector("altcha-widget").addEventListener("statechange", (ev) =>
                {
                    if (ev.detail.state === "verified")
                    {
                        captcha = ev.detail.payload

                        document.querySelector("altcha-widget").style.display = 'none'
                        document.querySelector("dialog.problem .submit button").style.display = 'block'
                    }
                })

            }

            function citestyle(style, result)
            {
                let   divr   = document.querySelector('div.ref')
                let   divs   = document.querySelector('div.style')
                let [ divp,
                      divc ] = document.querySelectorAll('div.cite')

                if (style == 'plain' && result.success)
                {
                    toggle([divr, divp])
                    toggle([divc, divs], null)
                }

                else

                if (result.style && result.style != divs.innerText)
                {
                    divc.innerText = result.citation
                    divs.innerText = result.style
                    
                    toggle([divr, divp], null)
                    toggle([divc, divs])
                }
            }

        </script>
