extends: consistency
message: "Mix of American and British English ('%s'). Marine Policy accepts either, not both."
link: https://www.sciencedirect.com/journal/marine-policy/publish/guide-for-authors
level: warning
ignorecase: true
either:
  behaviour: behavior
  favour: favor
  organise: organize
  organisation: organization
  analyse: analyze
  centre: center
  defence: defense
  labour: labor
  licence: license
  towards: toward
  whilst: while
  amongst: among
  modelling: modeling
  ageing: aging
