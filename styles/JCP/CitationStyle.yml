extends: existence
message: "Journal of Cleaner Production uses author–year citations (e.g. Smith, 2020), not numbered '%s'."
link: https://www.sciencedirect.com/journal/journal-of-cleaner-production/publish/guide-for-authors
level: warning
nonword: true
ignorecase: false
tokens:
  - '\[[0-9]{1,3}(?:\s*,\s*[0-9]{1,3})+\]'
  - '\[[0-9]{1,3}\s*[-–]\s*[0-9]{1,3}\]'
  - '\b(?:et al\.?|[A-Z][A-Za-z''’-]+)\s+\[[0-9]{1,3}\]'
