# scihub-dl configuration. Copied verbatim by `scihub-dl` on start; edit freely.

# Contact email sent to Crossref / Unpaywall / OpenAlex (polite pool). Required by Unpaywall.
email = "glen.w.wright@gmail.com"

# Where PDFs land. Sub-folders mirror the Zotero collection path.
out_dir = "~/Documents/Paperful/out"

# Where manifest.jsonl and the Zotero local-API key live.
state_dir = "~/Documents/Paperful/state"

# Source order. Open-access first, campus EZProxy, Sci-Hub last.
# Remove "scihub" / "scholar" / "ezproxy" to disable. Scholar is optional (CAPTCHA-prone).
sources = ["unpaywall", "openalex", "arxiv", "biorxiv", "europepmc", "semanticscholar", "scholar", "direct", "ezproxy", "scihub"]

# Campus EZProxy (any institution that offers login?url=). Leave empty to disable.
# Find the URL on your library site (“EZProxy” / off-campus access), then:
#   uv run scihub-dl ezproxy   → browser SSO → export Netscape cookies → state/ezproxy-cookies.txt
# Never put your password here. See README “Campus EZProxy”.
ezproxy_base = "https://scpo.idm.oclc.org/login?url="
# ezproxy_cookies = "state/ezproxy-cookies.txt"  # default under state_dir

# Ordered Sci-Hub mirrors. Reorder after `scihub-dl mirrors` if one dies.
scihub_mirrors = ["sci-hub.ru", "sci-hub.ren", "sci-hub.box", "sci-hub.se", "sci-hub.st"]

# Random delay between Sci-Hub requests, seconds [min, max].
delay_scihub_s = [3.0, 8.0]

# Parallelism for open-access sources; Sci-Hub is always serial.
concurrency_oa = 4

# Reject downloads smaller than this (bytes) - usually an HTML error page.
min_pdf_bytes = 10000

# Crossref title lookup: accept a DOI only if normalised title similarity >= this.
crossref_min_score = 0.90

# Attach downloaded PDFs into Zotero (needs Zotero 10+ with local API enabled).
attach = true
app_name = "scihub-dl"

# Consecutive network failures before a Sci-Hub mirror is skipped for the rest of the run.
mirror_failures_before_skip = 3
