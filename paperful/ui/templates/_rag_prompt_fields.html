<fieldset class="rag-prompt">
  <legend>Custom system prompt (optional)</legend>
  {% if rag_config_prompt %}<p class="counts">Config default: {{ rag_config_prompt }}</p>{% endif %}
  <div class="field-group">
    <label>Inline <textarea name="prompt_inline" rows="4" placeholder="Overrides focus when set"></textarea></label>
    <label>Upload <input type="file" name="prompt_upload" accept=".md,.txt,text/plain,text/markdown"></label>
    <label>Path <input name="prompt_path" placeholder="prompts/ask.md"></label>
    {% if saved_prompts %}
    <label>Saved
      <select name="prompt_saved">
        <option value="default">—</option>
        {% for p in saved_prompts %}
        <option value="{{ p.name }}">{{ p.label }}</option>
        {% endfor %}
      </select>
    </label>
    {% endif %}
    <label><input type="checkbox" name="save_prompt" value="1"> Save inline/upload as</label>
    <input name="prompt_save_name" placeholder="my-prompt.md">
  </div>
</fieldset>
