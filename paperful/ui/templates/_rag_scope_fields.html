{% from "_help.html" import info %}
<div class="field-group">
  <p class="field-legend">Scope {{ info("Which indexed items this run considers. The collection chip is the default. Keys, type, and years further narrow it.") }}</p>
  <p class="section-lede">Leave these blank to use the collection chip (or the whole mirror when no chip is set). Item keys override the collection.</p>
  <label>Item keys {{ info("Zotero item keys, one per line or comma-separated. When set, only these items are used.") }} <textarea name="item_keys" rows="2" placeholder="One key per line or comma-separated"></textarea></label>
  <label>Type {{ info("Limit to a Zotero item type such as journalArticle or report.") }} <input name="item_type" placeholder="journalArticle"></label>
  <label>Top-k {{ info("How many matching passages to retrieve per question. Higher values cost more tokens and can add noise.") }} <input type="number" name="top_k" min="1"></label>
  <label>Year from {{ info("Only items dated this year or later. Undated items are excluded.") }} <input type="number" name="year_from" value="{{ year_from }}"></label>
  <label>Year to {{ info("Only items dated this year or earlier. Undated items are excluded.") }} <input type="number" name="year_to" value="{{ year_to }}"></label>
</div>
