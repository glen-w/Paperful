<label>Item keys <textarea name="item_keys" rows="2" cols="40" placeholder="One key per line or comma-separated"></textarea></label>
<label>Type <input name="item_type" placeholder="journalArticle"></label>
<label>Top-k <input type="number" name="top_k" min="1"></label>
<label>Year from <input type="number" name="year_from" value="{{ year_from }}"></label>
<label>Year to <input type="number" name="year_to" value="{{ year_to }}"></label>
