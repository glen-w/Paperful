{% extends "base.html" %}
{% block title %}Settings — Paperful{% endblock %}
{% block content %}
<h1>Settings</h1>
{% if saved %}<p>Saved.</p>{% endif %}
<section class="panel">
  <h2>Paths &amp; preset</h2>
<form method="post" action="/settings" class="form-stack">
  <div class="field-group">
    <p class="field-legend">Local</p>
    <label>Unpaywall email <input name="email" value="{{ email }}"></label>
    <label>out/ path <input name="out_dir" value="{{ out_dir }}"></label>
    <label>Preset
      <select name="preset">
        <option value="oa" {% if prefs.preset == 'oa' %}selected{% endif %}>Open access</option>
        <option value="eoi" {% if prefs.preset == 'eoi' %}selected{% endif %}>Campus</option>
      </select>
    </label>
    <button type="submit">Save</button>
  </div>
</form>
</section>
{% endblock %}
