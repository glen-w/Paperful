# Ocean / governance grey-lit example pack — proposed builtin replacement.
# Disable with grey_playbooks_builtin = false, or override any name via [[grey_playbooks]].
#
# Diff vs current shipped file: DROP iea/irena/oecd/who (moved to energy + intl-orgs
# example files for grey_playbooks_dir). ADD rfmo-docs, iucn-dosi, thinktank-ocean.
#
# Named playbooks:
#   undocs-unga-vme (+ -symbol) — UNGA resolutions & SG reports
#   bbnj-doalos-prepcom          — BBNJ + DOALOS (+ HSA / IISD mirrors)
#   isa-deepdata                 — ISA document landings
#   fao                          — FAO /3/{code} rewrite
#   rfmo-docs                    — SPRFMO / NEAFC / CCAMLR landings
#   iucn-dosi                    — IUCN / DOSI briefs
#   thinktank-ocean              — IDDRI + Pew only (not High Seas Alliance)

# --- undocs-unga-vme ---------------------------------------------------------

[[grey_playbooks]]
name = "undocs-unga-vme"
kind = "rewrite"
hosts = ["undocs.org", "documents.un.org", "docs.un.org", "daccess-ods.un.org"]
parser = "undocs"

[[grey_playbooks]]
name = "undocs-unga-vme-symbol"
kind = "synthesize"
# A/RES/61/105, A/75/157, A/CONF.232/2023/4, A/AC.292|296/…, S/2024/55,
# ISBA/27/C/15, Add./Rev./Corr./INF suffixes
match_re = '''(?ix)\b(
    (?:A|S|E|ST|UNEP|ISA|SPLOS|ISBA)
    (?:/[A-Z]{1,12}(?:\.\d+)?|/\d{1,4})+
    (?:/(?:Add|Rev|Corr)\.\d+)*
    (?:/?INF(?:\.\d+)?(?:/\d+)?)*
)\b'''
pdf_template = "https://undocs.org/pdf?symbol={0}"

# --- bbnj-doalos-prepcom -----------------------------------------------------

[[grey_playbooks]]
name = "bbnj-doalos-prepcom"
kind = "scrape"
# Owns all of un.org (first-match-wins). Do not add un.org hosts to intl-orgs.
# NGO mirrors: highseasalliance, ENB/IISD.
hosts = ["un.org", "highseasalliance.org", "iisd.org"]
href_re = '''(?i)\.pdf(?:\?|$)|/sites/default/files/|/wp-content/uploads/|/bitstream/|download|/depts/los/|/bbnjagreement/'''

# --- isa-deepdata ------------------------------------------------------------

[[grey_playbooks]]
name = "isa-deepdata"
kind = "scrape"
# OBIS/ODIS cross-links are reference-only.
hosts = ["isa.org.jm"]
href_re = '''(?i)\.pdf(?:\?|$)|/wp-content/uploads/|/documents/|/bitstream/|download'''

# --- fao ---------------------------------------------------------------------

[[grey_playbooks]]
name = "fao"
kind = "rewrite"
hosts = ["fao.org", "documents.fao.org"]
url_re = '''(?i)(?:www\.)?(?:documents\.)?fao\.org/3/(?P<code>[a-z0-9]+)/'''
pdf_template = "https://www.fao.org/3/{code}/{code}.pdf"

# --- rfmo-docs (NEW) ---------------------------------------------------------

[[grey_playbooks]]
name = "rfmo-docs"
kind = "scrape"
# FAO stays on `fao`. Do not add fao.org here.
hosts = ["sprfmo.int", "neafc.org", "ccamlr.org"]
href_re = '''(?i)\.pdf(?:\?|$)|/publications/|/documents/|/wp-content/uploads/|download|/meetings/'''

# --- iucn-dosi (NEW) ---------------------------------------------------------

[[grey_playbooks]]
name = "iucn-dosi"
kind = "scrape"
hosts = ["iucn.org", "dosi-project.org"]
href_re = '''(?i)\.pdf(?:\?|$)|/sites/default/files/|/wp-content/uploads/|/resources/|download'''

# --- thinktank-ocean (NEW) ---------------------------------------------------

[[grey_playbooks]]
name = "thinktank-ocean"
kind = "scrape"
# High Seas Alliance stays on bbnj-doalos-prepcom — do not list it here.
hosts = ["iddri.org", "pewtrusts.org"]
href_re = '''(?i)\.pdf(?:\?|$)|/sites/default/files/|/wp-content/uploads/|/en/publications/|download'''
