# Build-local image against host Zotero / Ollama.
#   cp .env.example .env
#   # keep repo-local data: PAPERFUL_DATA=. and PAPERFUL_OUT=./out
#   # or sibling mounts: ../paperful-data + ../paperful-out (defaults)
#   docker compose build
#   docker compose up                 # GUI at http://127.0.0.1:8765 (assumes setup done)
#   docker compose run --rm paperful doctor
#   docker compose run --rm paperful run --collection interesting --dry-run

services:
  paperful:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # light = serve only (CI default). heavy = llm + rag + browser-agent.
        PAPERFUL_IMAGE_MODE: ${PAPERFUL_IMAGE_MODE:-light}
    image: paperful:local
    working_dir: /data
    environment:
      PAPERFUL_ZOTERO_HOST: ${PAPERFUL_ZOTERO_HOST:-host.docker.internal}
      # Reach host Ollama; loopback [llm].base_url is rewritten the same way.
      PAPERFUL_OLLAMA_HOST: ${PAPERFUL_OLLAMA_HOST:-host.docker.internal}
      # Reach host GROBID; loopback [grobid].base_url is rewritten the same way.
      PAPERFUL_GROBID_HOST: ${PAPERFUL_GROBID_HOST:-host.docker.internal}
      PAPERFUL_IMAGE_MODE: ${PAPERFUL_IMAGE_MODE:-light}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Durable config/state/packs (not the PDF tree).
      - ${PAPERFUL_DATA:-../paperful-data}:/data
      # PDF mirror — separate mount so out/ can live on another disk/backup.
      - ${PAPERFUL_OUT:-../paperful-out}:/data/out
    ports:
      # Localhost only (no LAN). Same workbench as host `paperful serve`.
      - "127.0.0.1:8765:8765"
    # `compose up` → GUI. CLI one-shots: docker compose run --rm paperful <cmd>
    # 0.0.0.0 is required inside the container; publish stays 127.0.0.1:8765.
    # --allow-remote-bind is the explicit opt-in for non-loopback bind (no auth).
    command:
      [
        "serve",
        "--host",
        "0.0.0.0",
        "--port",
        "8765",
        "--allow-remote-bind",
      ]
    # TTY for coloured CLI when using compose run. Scripts: -T.
    stdin_open: true
    tty: true
