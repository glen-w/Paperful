name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m smoke -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check paperful tests
      - run: uv run ruff format --check paperful tests
      - run: uv run mypy

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv pip install pip-audit
      - run: uv run pip-audit

  suite:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m "not docs" --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1,localhost --cov=paperful --cov-report=term-missing --cov-report=json:coverage.json
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
          retention-days: 5

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker compose build
      - name: Compose config
        run: docker compose config >/dev/null
      - name: Smoke help and doctor without Zotero
        run: |
          data="$(mktemp -d)"
          out="$(mktemp -d)"
          chmod 0777 "$data" "$out"
          cp config.example.toml "$data/config.toml"
          export PAPERFUL_DATA="$data"
          export PAPERFUL_OUT="$out"
          docker compose run --rm -T paperful --help
          set +e
          docker compose run --rm -T paperful doctor --no-guide
          code=$?
          set -e
          test "$code" -eq 2
