# Minimum gate. The OS/Python matrix, lint, audit, socket, fresh-install,
# browser, and docker jobs are parked. Bring them back one step at a time:
# docs/ROADMAP.md (CI gate, cut back to smoke).
name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m smoke -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv run ruff check paperful tests
      - run: uv run ruff format --check paperful tests
      - run: uv run mypy

  suite:
    # Full offline suite on one cell. Its coverage report feeds the badge.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m "not docs" -q --cov=paperful --cov-report=term --cov-report=json:coverage.json
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
          retention-days: 5
