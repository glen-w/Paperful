# Required gate is smoke only. lint / suite / docker are advisory so flaky or
# suite-drift failures do not block merges; run them locally before release.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --extra serve
      - name: CLI boots
        run: |
          uv run paperful version
          uv run paperful --help >/dev/null
      - name: Smoke tests
        run: uv run pytest -m smoke -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      # Curated advisory check: undefined names + high-signal security rules.
      # Broader ruff (full E/F/S) is still noisy; expand selects deliberately.
      - run: uv run ruff check paperful tests

  suite:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m "not docs" --cov=paperful --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=0
      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker compose build
      - name: Compose config
        run: docker compose config >/dev/null
      - name: Smoke help and doctor without Zotero
        # Compose-first claim: advisory proof that the image boots.
        # No live Zotero on the runner → doctor exit 2 (Zotero row red).
        run: |
          data="$(mktemp -d)"
          out="$(mktemp -d)"
          # Image runs as uid 1000; mktemp is 0700 for the runner uid — open the mounts.
          chmod 0777 "$data" "$out"
          cp config.example.toml "$data/config.toml"
          export PAPERFUL_DATA="$data"
          export PAPERFUL_OUT="$out"
          docker compose run --rm -T paperful --help
          set +e
          docker compose run --rm -T paperful doctor --no-guide
          code=$?
          set -e
          test "$code" -eq 2
