name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m smoke -q

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --group dev
      - run: uv run ruff check paperful tests
      - run: uv run ruff format --check paperful tests
      - run: uv run mypy

  audit:
    # Required since 1.7: the locked environment must audit clean.
    # Runs on 3.12 — the Python 3.10 resolution keeps pillow 12.x (pillow 13
    # requires 3.11+); see docs/plans/1.7-wave.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev
      - run: uv pip install pip-audit
      - run: uv run pip-audit
      - name: SBOM (CycloneDX) for the locked environment
        run: uv run pip-audit --format cyclonedx-json --output sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 30

  socket:
    # Required since 1.7: the offline suite must not open real sockets.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m "not docs" -q --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,::1,localhost

  fresh-install:
    # Required since 1.7: a clean pipx-style install reaches the workbench.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Isolated install with [serve]
        run: |
          uv venv /tmp/fresh-venv
          uv pip install --python /tmp/fresh-venv/bin/python ".[serve]"
      - name: Doctor without Zotero exits 2 with next steps
        working-directory: /tmp
        run: |
          mkdir -p /tmp/fresh-data
          cp "$GITHUB_WORKSPACE/config.minimal.toml" /tmp/fresh-data/config.toml
          cd /tmp/fresh-data
          set +e
          /tmp/fresh-venv/bin/paperful doctor --no-guide
          code=$?
          set -e
          test "$code" -eq 2
      - name: Workbench serves /health
        working-directory: /tmp/fresh-data
        run: |
          /tmp/fresh-venv/bin/paperful serve --port 8799 &
          trap 'kill %1 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8799/health && exit 0
            sleep 1
          done
          echo "workbench did not come up" >&2
          exit 1

  suite:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m "not docs" --cov=paperful --cov-report=term-missing --cov-report=json:coverage.json
      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-json
          path: coverage.json
          if-no-files-found: error
          retention-days: 5

  browser:
    # Workbench in a real Chromium: no horizontal overflow at 390/1440 px, no
    # console errors, no third-party requests, no inline handlers, and the
    # Preview-gated Apply / shared drawer / orphan-job flows work with JS on.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev --extra serve
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser tests/browser -q

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build local image
        run: docker compose build
      - name: Compose config
        run: docker compose config >/dev/null
      - name: Smoke help and doctor without Zotero
        run: |
          data="$(mktemp -d)"
          out="$(mktemp -d)"
          chmod 0777 "$data" "$out"
          cp config.example.toml "$data/config.toml"
          export PAPERFUL_DATA="$data"
          export PAPERFUL_OUT="$out"
          docker compose run --rm -T paperful --help
          set +e
          docker compose run --rm -T paperful doctor --no-guide
          code=$?
          set -e
          test "$code" -eq 2
