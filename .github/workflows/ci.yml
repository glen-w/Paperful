# Minimum gate. The OS/Python matrix, lint, audit, socket, fresh-install,
# browser, and docker jobs are parked. Bring them back one step at a time:
# docs/ROADMAP.md (CI gate, cut back to smoke).
name: CI

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --group dev --extra serve
      - run: uv run pytest -m smoke -q
