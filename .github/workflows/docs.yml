# Advisory docs build — does not gate merges (see continue-on-error).
# Merge blockers live in ci.yml (pytest + Docker). Maintainers: DOCS_STRICT=1 make docs locally.
name: Docs

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra docs --group dev
      - name: Guide corpus + Sphinx build (warnings OK)
        run: |
          uv run pytest tests/test_sphinx_docs.py -m docs -q
          make docs
      - name: Upload docs HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html/
          if-no-files-found: warn
