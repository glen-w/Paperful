# Upload release wheels to PyPI (trusted publishing).
# One-time setup: https://docs.pypi.org/trusted-publishers/
#   Owner: glen-w  Repo: Paperful  Workflow: publish.yml  Environment: pypi
name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Pre-release checks
        run: bash scripts/release/pre_release.sh
      - name: Build packages
        run: uv build
      - name: Verify dist artifacts
        run: bash scripts/release/pre_release.sh --dist-only
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          # PEP 740 attestations POST to rekor.sigstore.dev. A Rekor 502
          # aborts the upload even after metadata checks pass (1.6.3).
          # Trusted Publishing (OIDC, id-token: write) is independent.
          attestations: false

  release:
    # A tag push also gets a GitHub Release, so GitHub Latest matches PyPI.
    # Notes are that version's changelog section.
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Create the release when the tag has none
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists"
            exit 0
          fi
          awk -v v="$version" '$0 ~ "^## " v " " {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$tag" --title "$version" --notes-file notes.md --latest
