# Refresh badges/coverage.json after a green CI run on main.
# The commit message skips CI so this cannot loop.
name: Coverage badge

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  actions: read

jobs:
  badge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push' &&
      github.repository == 'glen-w/Paperful'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: coverage-json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Write Shields endpoint
        run: python3 scripts/coverage_badge.py coverage.json badges/coverage.json
      - name: Commit badge when the percentage changes
        run: |
          git add badges/coverage.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: refresh coverage badge [skip ci]"
          git push
