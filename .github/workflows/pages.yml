name: Deploy website + Sphinx docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "scripts/release/build_docs.sh"
      - "scripts/release/assemble_pages_site.sh"
      - "scripts/release/build_docs.sh"
      - "tests/test_sphinx_docs.py"
      - "pyproject.toml"
      - "Makefile"
      - ".github/workflows/pages.yml"
      - "website/CNAME"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --extra docs --group dev
      - name: Guide corpus check (advisory)
        continue-on-error: true
        run: uv run pytest tests/test_sphinx_docs.py -m docs -q
      - name: Assemble site (Sphinx warnings do not fail deploy)
        run: bash scripts/release/assemble_pages_site.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
