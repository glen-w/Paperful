[project]
name = "paperful"
version = "1.7.0"
description = "Find missing PDFs for a Zotero library: clean records, summarise papers, keep a platform-agnostic mirror."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Glen Wright" }]
keywords = ["zotero", "research", "pdf", "bibliography", "literature", "open-access", "unpaywall"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "pyzotero>=1.15.1,<1.16", # attach.py subclasses private pyzotero._upload.Zupload
    "httpx>=0.27",
    "urllib3>=2.8",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13",
    "pypdf>=6.21.4",
    "filelock>=3.18",
    "tomli>=2.0; python_version < '3.11'",
    "fonttools>=4.0",
    "defusedxml>=0.7.1",  # hardened XML parsing for network/import surfaces
]

[project.optional-dependencies]
# Playwright is imported lazily (session vault, htmlpdf, rewrite PDF) so the
# core and [serve] installs stay lean. `paperful doctor` names this extra
# when a browser lane is configured but the package is missing.
browser = ["playwright>=1.60"]  # htmlpdf + session login CDP no_defaults
# Kept for older install docs (`pip install paperful[htmlpdf]`).
htmlpdf = ["playwright>=1.60"]
llm = ["litellm>=1.70,<2"]
# Library index for `paperful rag` / `paperful ask`. Embeddings go through [llm].
rag = ["lancedb>=0.39,<1"]
# Layout-aware PDF parsing for `[rag].parser = "docling"`. Pulls in torch.
rag-docling = ["docling>=2"]
browser-agent = [
    "browser-use>=0.11; python_version >= '3.11'",
    "ollama>=0.4; python_version >= '3.11'",
]
serve = ["fastapi>=0.115", "uvicorn>=0.32", "jinja2>=3.1", "python-multipart>=0.0.9"]
# ORCID ego co-authorship SNA (betweenness, constraint, brokerage, --figures).
network = ["networkx>=3,<4", "matplotlib>=3.8"]
# Microsoft Open XML SDK validator (Python port) for rewrite tracked.docx /
# .pptx / .xlsx; ODF adapter for tracked.odt.
openxml = ["openxml-audit>=0.8,<1"]
# Binoculars (critique --ai-model) is a git overlay, not a locked extra: it
# cannot resolve with rag-docling / browser-agent in one lockfile. Install:
#   uv pip install "binoculars @ git+https://github.com/ahans30/Binoculars.git"
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2023.9.10",
    "sphinx-autobuild>=2021.3.14",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.scripts]
paperful = "paperful.cli:app"

[project.urls]
Homepage = "https://paperful.app/"
Documentation = "https://paperful.app/guide/"
Repository = "https://github.com/glen-w/Paperful"
Issues = "https://github.com/glen-w/Paperful/issues"
Changelog = "https://github.com/glen-w/Paperful/blob/main/CHANGELOG.md"

[dependency-groups]
# lancedb here so CI runs the index tests.
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-socket>=0.7",
    "playwright>=1.60",
    "ruff>=0.9",
    "mypy>=1.11",
    "lancedb>=0.39,<1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "httpx>=0.27",
    # Workbench tests render Jinja and post forms. CI also passes --extra serve.
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "networkx>=3,<4",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperful"]

[tool.hatch.build.targets.sdist]
# Personal config (email), runtime state/output and editor files never ship.
# Keep the sdist lean: wheel already ships the package; skip lockfile, site
# marketing assets, and Sphinx static captures (duplicated logos/screenshots).
exclude = [
    "config.toml",
    "out/",
    "state/",
    "packs/",
    ".cursor/",
    ".claude/",
    ".coverage",
    "*.log",
    "uv.lock",
    "website/",
    "paperful-cloud/",
    "docs/_static/",
    "docs/logo.png",
    "docs/logo-dark.png",
    "docs/icon.png",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "grey_live: network probe of tests/fixtures/grey/corpus.toml (set PAPERFUL_GREY_LIVE=1)",
    "e2e_live: opt-in all-in E2E (NBA 2025–2026); set PAPERFUL_E2E=1 — see docs/e2e-nba.md",
    "docs: guide corpus / Sphinx toctree hygiene (advisory in CI; see .github/workflows/docs.yml)",
    "smoke: install/boot/route smoke for CI gate",
    "browser: opt-in Playwright Chromium lane over the workbench (uv run pytest -m browser)",
]
addopts = "-m 'not browser'"

[tool.coverage.run]
source = ["paperful"]
# Opt-in E2E and live-browser lanes are not part of the default offline unit gate.
# Mendeley and EndNote are measured: their offline fixtures are the adapter contract.
omit = [
    "paperful/e2e_nba.py",
    # Workbench job bodies: exercised via ``paperful[serve]`` route tests.
    "paperful/ui/repair_jobs.py",
    "paperful/ui/discover_jobs.py",
    "paperful/ui/wanted_jobs.py",
    "paperful/sources/author_site.py",
    "paperful/browser_agent.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Stretch goal 85%; gate tracks offline suite + scoped omits below.
fail_under = 82

[tool.ruff]
target-version = "py310"
src = ["paperful", "tests"]

[tool.ruff.lint.per-file-ignores]
# Tests assert bind-refusal behaviour with literal 0.0.0.0 hosts.
"tests/**" = ["S104"]
# DuckDB SQL is built from internal column expressions; DOI/id values are
# escaped via _sql_str/_sql_str_list (see snowball/local_openalex.py).
"paperful/snowball/local_openalex.py" = ["S608"]
# Facade / re-export modules: cli.py, the *_cmd shims, ui/pages.py and the
# route registrars import names so tests and sibling modules can reach them
# through one namespace. F401 stays on everywhere else (1.7 wave).
"paperful/attach_cmd.py" = ["F401"]
"paperful/attachments_cmd.py" = ["F401"]
"paperful/authors_cmd.py" = ["F401"]
"paperful/authorwatch_cmd.py" = ["F401"]
