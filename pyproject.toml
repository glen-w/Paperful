[project]
name = "paperful"
version = "0.1.0"
description = "Fill the gaps in your Zotero library: fetch missing PDFs, save them in a collection-shaped folder tree, attach them back."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzotero>=1.15,<2",  # attach.py subclasses pyzotero._upload.Zupload
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13",
    "pypdf>=5.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
htmlpdf = ["playwright>=1.40"]
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2023.9.10",
    "sphinx-autobuild>=2021.3.14",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.scripts]
paperful = "paperful.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperful"]

[tool.hatch.build.targets.wheel.force-include]
"paperful/data" = "paperful/data"

[tool.hatch.build.targets.sdist]
# Personal config (email), runtime state/output and editor files never ship.
exclude = ["config.toml", "out/", "state/", ".cursor/", ".coverage", "*.log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
