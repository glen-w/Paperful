[project]
name = "paperful"
version = "0.9.0"
description = "Research helper for a reference library: clean records, find missing PDFs, summarise papers, keep a platform-agnostic mirror. Zotero is the well-tested adapter; Mendeley and EndNote are seeking testers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzotero>=1.15.1,<1.16", # attach.py subclasses private pyzotero._upload.Zupload
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "typer>=0.12",
    "rich>=13",
    "pypdf>=5.0",
    "tomli>=2.0; python_version < '3.11'",
    "fonttools>=4.0",
    "playwright>=1.40",  # htmlpdf source + session login (Chromium)
]

[project.optional-dependencies]
# Kept for older install docs (`pip install paperful[htmlpdf]`); Playwright is now core.
htmlpdf = ["playwright>=1.40"]
llm = ["litellm>=1.70,<2"]
browser-agent = [
    "browser-use>=0.11; python_version >= '3.11'",
    "ollama>=0.4; python_version >= '3.11'",
]
docs = [
    "sphinx>=7.0.0",
    "myst-parser>=2.0.0",
    "furo>=2023.9.10",
    "sphinx-autobuild>=2021.3.14",
    "sphinxcontrib-mermaid>=0.9.2",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.scripts]
paperful = "paperful.cli:app"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paperful"]

[tool.hatch.build.targets.sdist]
# Personal config (email), runtime state/output and editor files never ship.
exclude = ["config.toml", "out/", "state/", "packs/", ".cursor/", ".coverage", "*.log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
